<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="main_style.css" />
        <link rel="stylesheet" href="myspace_style.css" />
        <title>個人空間 - 小百岳</title>
    </head>
    <body>
        <div class="main_menu">
            <ul class="menu_list">
                <li class="menu_part" id="mainBtn">首頁</li>
                <li class="menu_part" id="mySpaceBtn">我的空間</li>
                <li class="menu_part" id="northBtn">北部區域</li>
                <li class="menu_part" id="centerBtn">中部區域</li>
                <li class="menu_part" id="southBtn">南部區域</li>
                <li class="menu_part" id="eastBtn">東部區域</li>
                <li class="menu_part" id="islandBtn">離島區域</li>
            </ul>
        </div>

        <div class="main_container">
            <!-- ===== 左側 ===== -->
            <div class="left_container">
                <div class="avatar_area">
                    <div
                        class="avatar_circle"
                        id="avatarContainer"
                        style="cursor: pointer"
                        title="點擊更換頭貼"
                    >
                        <img
                            id="userAvatar"
                            src="images/default_pfp.jpg"
                            alt="頭像"
                        />
                        <input
                            type="file"
                            id="avatarInput"
                            accept="image/*"
                            style="display: none"
                            maxlength="10"
                        />
                    </div>
                </div>

                <div class="name_area">
                    <div style="display: flex; align-items: center; gap: 8px">
                        <span class="username" id="userNameDisplay">User</span>
                        <button id="editNameBtn">✏️</button>
                    </div>

                    <div class="level_row">
                        <span class="level_badge">LV. 1</span>
                        <div class="exp_track">
                            <div class="exp_fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <span class="exp_label">0 / 120</span>
                </div>

                <div class="achivement_area">
                    <span class="achivement_title">成就徽章</span>
                    <div class="badge_list">
                    </div>
                </div>
            </div>

            <!-- 中間容器 -->
            <div class="center_container">
                <div class="circle_wrap">
                    <svg viewBox="0 0 160 160">
                        <circle
                            cx="80"
                            cy="80"
                            r="66"
                            fill="none"
                            stroke="#c4d9ca"
                            stroke-width="14"
                        />

                        <circle
                            cx="80"
                            cy="80"
                            r="66"
                            fill="none"
                            stroke="#2d5e2f"
                            stroke-width="14"
                            stroke-linecap="round"
                            stroke-dasharray="0 414.7"
                            transform="rotate(-90 80 80)"
                        />
                    </svg>
                    <div class="circle_label">
                        <span class="circle_title">小百岳進度</span>
                        <span class="circle_pct">0%</span>
                    </div>
                </div>

                <div class="process_bar_area">
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>北部區域</span><span>0/35</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>中部區域</span><span>0/25</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>南部區域</span><span>0/25</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>東部區域</span><span>0/12</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>離島區域</span><span>0/3</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右邊區域 -->
            <div class="right_container">
                <div class="note_header">
                    <div class="note_title">我的日記</div>
                    <div class="data_actions">
                        <button
                            id="importBtn"
                            class="data_btn"
                            title="匯入紀錄檔案"
                        >
                            匯入
                        </button>
                        <button
                            id="exportBtn"
                            class="data_btn"
                            title="將目前的紀錄匯出"
                        >
                            匯出
                        </button>
                        <input
                            type="file"
                            id="importInput"
                            accept=".json"
                            style="display: none"
                        />
                    </div>
                </div>
                <button class="note_add_btn">＋ 新增日記</button>

                <div class="note_list"></div>

                <div
                    id="viewDiaryModal"
                    class="modal_overlay"
                    style="display: none"
                >
                    <div class="modal_content">
                        <h3 id="viewDiaryTitle">日記標題</h3>
                        <div
                            id="viewDiaryMountain"
                            style="
                                color: #637864;
                                font-size: 15px;
                                font-weight: bold;
                                margin-top: -5px;
                            "
                        >
                            山脈名稱
                        </div>
                        <div
                            id="viewDiaryDate"
                            style="
                                color: #8da48f;
                                font-size: 12px;
                                margin-bottom: 5px;
                            "
                        >
                            XXXX/YY/ZZ
                        </div>

                        <hr
                            style="
                                border: 0;
                                border-top: 1px solid #637864;
                                margin: 5px 0;
                            "
                        />

                        <p
                            id="viewDiaryContent"
                            style="
                                white-space: pre-wrap;
                                line-height: 1.6;
                                color: #333;
                                max-height: 300px;
                                overflow-y: auto;
                                margin: 0;
                                text-align: justify;
                            "
                        ></p>

                        <div class="modal_actions">
                            <button
                                id="closeViewBtn"
                                class="cancel_btn"
                                style="width: 100%"
                            >
                                關閉
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--登山日記彈窗-->
        <div id="diaryModal" class="modal_overlay" style="display: none">
            <div class="modal_content">
                <h3>新增登山日記</h3>
                <input
                    type="text"
                    id="diaryTitle"
                    placeholder="請輸入日記標題..."
                />

                <select id="mountainSelect">
                    <option value="" disabled selected>
                        請選擇這次攀登的山脈...
                    </option>
                </select>

                <textarea
                    id="diaryContent"
                    placeholder="記錄一下心得吧..."
                ></textarea>

                <div class="modal_actions">
                    <button id="cancelDiaryBtn" class="cancel_btn">取消</button>
                    <button id="saveDiaryBtn" class="save_btn">儲存日記</button>
                </div>
            </div>
        </div>

        <!--修改姓名彈窗-->
        <div id="nameModal" class="modal_overlay" style="display: none">
            <div class="modal_content">
                <h3>修改使用者名稱</h3>
                <input
                    type="text"
                    id="newUserNameInput"
                    placeholder="請輸入新的名稱..."
                />
                <div class="modal_actions">
                    <button id="cancelNameBtn" class="cancel_btn">取消</button>
                    <button id="saveNameBtn" class="save_btn">儲存</button>
                </div>
            </div>
        </div>
        
        <!--登山進度彈窗-->
        <div id="regionModal" class="modal_overlay" style="display: none">
            <div class="modal_content" style="max-width: 700px; width: 90%;">
                <h3 id="regionModalTitle">區域進度</h3>
                <div class="modal_actions" style="justify-content: flex-start; margin-bottom: 10px;"></div>
                <div id="regionMountainList" class="region_mt_list"></div>

                <div class="modal_actions">
                    <button id="closeRegionModalBtn" class="cancel_btn" style="width: 100%;">關閉</button>
                </div>
            </div>
        </div>

        <script src="myspace.js"></script>
    </body>
</html>
