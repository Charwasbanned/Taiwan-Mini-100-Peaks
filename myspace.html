<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="main_style.css" />
        <link rel="stylesheet" href="myspace_style.css" />
        <title>個人空間 - 小百岳</title>
    </head>
    <body>
        <div class="main_menu">
            <ul class="menu_list">
                <li class="menu_part" id="mainBtn">首頁</li>
                <li class="menu_part" id="mySpaceBtn">我的空間</li>
                <li class="menu_part" id="northBtn">北部區域</li>
                <li class="menu_part" id="centerBtn">中部區域</li>
                <li class="menu_part" id="southBtn">南部區域</li>
                <li class="menu_part" id="eastBtn">東部區域</li>
                <li class="menu_part" id="islandBtn">離島區域</li>
            </ul>
        </div>

        <div class="main_container">
            <!-- ===== 左側 ===== -->
            <div class="left_container">
                <div class="avatar_area">
                    <div class="avatar_circle">
                        <img
                            src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/White-fronted_honeyeater_-_Round_Hill_NSW.jpg/1280px-White-fronted_honeyeater_-_Round_Hill_NSW.jpg?utm_source=species.wikimedia.org&utm_campaign=parser&utm_content=thumbnail"
                            alt="頭像"
                            onerror="
                                this.style.display = 'none';
                                this.nextElementSibling.style.display = 'flex';
                            "
                        />
                    </div>
                </div>

                <div class="name_area">
                    <span class="username">User</span>
                    <div class="level_row">
                        <span class="level_badge">LV. 11</span>
                        <div class="exp_track">
                            <div class="exp_fill" style="width: 46.9%"></div>
                        </div>
                    </div>
                    <span class="exp_label">120 / 256</span>
                </div>

                <div class="achivement_area">
                    <span class="achivement_title">成就徽章</span>
                    <div class="badge_list">
                        <div class="badge_item" data-tooltip="觀音山">
                            <div class="badge_icon"></div>
                        </div>
                        <div class="badge_item" data-tooltip="雪山徽章">
                            <div class="badge_icon"></div>
                        </div>
                        <div class="badge_item" data-tooltip="玉山徽章">
                            <div class="badge_icon"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 中間容器 -->
            <div class="center_container">
                <div class="circle_wrap">
                    <svg viewBox="0 0 160 160">
                        <circle
                            cx="80"
                            cy="80"
                            r="66"
                            fill="none"
                            stroke="#c4d9ca"
                            stroke-width="14"
                        />

                        <circle
                            cx="80"
                            cy="80"
                            r="66"
                            fill="none"
                            stroke="#2d5e2f"
                            stroke-width="14"
                            stroke-linecap="round"
                            stroke-dasharray="136.8 414.7"
                            transform="rotate(-90 80 80)"
                        />
                    </svg>
                    <div class="circle_label">
                        <span class="circle_title">小百岳進度</span>
                        <span class="circle_pct">33%</span>
                    </div>
                </div>

                <div class="process_bar_area">
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>北部區域</span><span>0/35</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 40%"></div>
                        </div>
                    </div>
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>中部區域</span><span>0/25</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 32%"></div>
                        </div>
                    </div>
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>南部區域</span><span>9/25</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 20%"></div>
                        </div>
                    </div>
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>東部區域</span><span>5/12</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 23%"></div>
                        </div>
                    </div>
                    <div class="process_bar">
                        <div class="bar_header">
                            <span>離島區域</span><span>1/3</span>
                        </div>
                        <div class="bar_track">
                            <div class="bar_fill" style="width: 33%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右邊區域 -->
            <div class="right_container">
                <div class="note_title">我的日記</div>
                <button class="note_add_btn">＋ 新增日記</button>

                <div class="note_list"></div>

                <div
                    id="viewDiaryModal"
                    class="modal_overlay"
                    style="display: none"
                >
                    <div class="modal_content">
                        <h3 id="viewDiaryTitle">日記標題</h3>
                        <div
                            id="viewDiaryMountain"
                            style="
                                color: #637864;
                                font-size: 15px;
                                font-weight: bold;
                                margin-top: -5px;
                            "
                        >
                            山脈名稱
                        </div>
                        <div
                            id="viewDiaryDate"
                            style="
                                color: #8da48f;
                                font-size: 12px;
                                margin-bottom: 5px;
                            "
                        >
                            XXXX/YY/ZZ
                        </div>

                        <hr
                            style="
                                border: 0;
                                border-top: 1px solid #637864;
                                margin: 5px 0;
                            "
                        />

                        <p
                            id="viewDiaryContent"
                            style="
                                white-space: pre-wrap;
                                line-height: 1.6;
                                color: #333;
                                max-height: 300px;
                                overflow-y: auto;
                                margin: 0;
                                text-align: justify;
                            "
                        ></p>

                        <div class="modal_actions">
                            <button
                                id="closeViewBtn"
                                class="cancel_btn"
                                style="width: 100%"
                            >
                                關閉
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--登山日記彈窗-->
        <div id="diaryModal" class="modal_overlay" style="display: none">
            <div class="modal_content">
                <h3>新增登山日記</h3>
                <input
                    type="text"
                    id="diaryTitle"
                    placeholder="請輸入日記標題..."
                />

                <select id="mountainSelect">
                    <option value="" disabled selected>
                        請選擇這次攀登的山脈...
                    </option>
                </select>

                <textarea
                    id="diaryContent"
                    placeholder="記錄一下心得吧..."
                ></textarea>

                <div class="modal_actions">
                    <button id="cancelDiaryBtn" class="cancel_btn">取消</button>
                    <button id="saveDiaryBtn" class="save_btn">儲存日記</button>
                </div>
            </div>
        </div>

        <script src="myspace.js"></script>
    </body>
</html>
