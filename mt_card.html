<!doctype html>
<html lang="zh-TW">
    <head>
        <link rel="stylesheet" href="main_style.css" />
        <link rel="stylesheet" href="mt_card_style.css" />
        <title>小百岳指南 - 山脈詳細簡介</title>
    </head>
    <body>
        <div class="main_menu">
            <ul class="menu_list">
                <li class="menu_part" id="mainBtn">首頁</li>
                <li class="menu_part" id="mySpaceBtn">我的空間</li>
                <li class="menu_part" id="northBtn">北部區域</li>
                <li class="menu_part" id="centerBtn">中部區域</li>
                <li class="menu_part" id="southBtn">南部區域</li>
                <li class="menu_part" id="eastBtn">東部區域</li>
                <li class="menu_part" id="islandBtn">離島區域</li>
            </ul>
        </div>

        <div class="container">
            <div class="mountain-header">
                <div class="mountain-title">
                    <h1 id="mtName">載入中...</h1>
                    <span id="mtEnglish">Loading...</span>
                </div>
                <button
                    id="statusBtn"
                    class="status-badge uncompleted"
                    data-id=""
                >
                    未完成
                </button>
            </div>

            <div class="info-content-wrapper">
                <div class="left-content">
                    <div class="info-grid">
                        <div class="info-item">
                            <strong>海拔高度</strong>
                            <span id="mtHeight">-</span>
                        </div>
                        <div class="info-item">
                            <strong>所在地區</strong>
                            <span id="mtLoc">-</span>
                        </div>
                        <div class="info-item">
                            <strong>所屬區域</strong>
                            <span id="mtRegion">-</span>
                        </div>
                    </div>

                    <div class="content-section">
                        <h3>交通路線</h3>
                        <p id="mtTransportation" class="route-box">-</p>
                    </div>

                    <div class="content-section">
                        <h3>山脈簡介</h3>
                        <div id="mtDescription" class="description-box">
                            正在從資料庫加載詳細介紹...
                        </div>
                    </div>
                </div>

                <div class="right-image-sidebar">
                    <div class="mountain-image-container">
                        <img id="mtImg" src="" alt="山脈相片" style="display: none;" />

                        <div class="image-placeholder" id="placeholder">
                            <div class="placeholder-icon">⛰️</div>
                            <div class="placeholder-text">
                                山脈相片<br /><small
                                    >（未來上傳相片）</small
                                >
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="mt_card.js"></script>
    </body>
</html>
